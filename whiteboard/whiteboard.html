<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivni Whiteboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="wb-style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <div class="wb-header">
        <span class="badge">Student Fun Zone</span>
        <h1>Interaktivni Whiteboard</h1>
        <p class="wb-subtitle">Crtajte, skicirajte i vizualizirajte ideje</p>
    </div>

    <div class="toolbar">
        <div class="toolbar-group">
            <label for="colorPicker">Boja</label>
            <input type="color" id="colorPicker" value="#000000">
        </div>
        <div class="toolbar-group">
            <label for="brushSize">Veličina</label>
            <input type="range" id="brushSize" min="1" max="20" value="3">
        </div>
        <div class="toolbar-group">
            <button id="eraserBtn">◻ Brisač</button>
            <button id="clearBtn">✕ Očisti</button>
            <button id="saveBtn">↓ Snimi PNG</button>
            <button id="savePdfBtn">↓ Snimi PDF</button>
            <button id="sendEmailBtn">✉ Pošalji mailom</button>
        </div>
    </div>

    <canvas id="board" width="960" height="560"></canvas>

    <footer>
        Web programiranje 2025/2026 &nbsp;·&nbsp;
        Internacionalna poslovno-informaciona akademija Tuzla
    </footer>

    <!-- Email popup -->
    <div class="overlay" id="emailOverlay">
        <div class="popup-box">
            <h3>Pošalji Whiteboard</h3>
            <p>Unesite e-mail adresu na koju želite poslati poruku o crtežu.</p>
            <div class="input-group">
                <input type="email" id="targetEmail" placeholder="ime.prezime@student.ipi.ba">
            </div>
            <div class="popup-buttons">
                <button id="popupCancelBtn">Poništi</button>
                <button id="popupSendBtn">Pošalji →</button>
            </div>
        </div>
    </div>

    <script src="wb-script.js"></script>
</body>
</html>
